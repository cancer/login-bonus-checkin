name = "login-bonus-checkin"
main = "src/index.js"
compatibility_date = "2025-06-01"
# Endfield プロバイダの署名で node:crypto (HMAC-SHA256 + MD5) を使うため必須。
compatibility_flags = ["nodejs_compat"]

# Cron Triggers (UTC)。HoYoLAB は UTC+8 00:00 リセット = 16:00 UTC。
# 余裕を見て 16:10 と予備 20:10 に実行。受取済みは無害なので複数回流してよい。
# サイトを増やしてリセット時刻が違う場合は cron を足す。
[triggers]
crons = ["10 16 * * *", "10 20 * * *"]

# クレデンシャル保存先。/admin から書き込む。作成:
#   npx wrangler kv namespace create CREDS
# 出力された id を下の id= に貼る。
[[kv_namespaces]]
binding = "CREDS"
id = "ここにKV名前空間のIDを貼る"

[vars]
# 実行するプロバイダ id（空白区切り）。未指定なら全登録プロバイダのうち
# クレデンシャルが設定済みのものを実行。 例: PROVIDERS = "hoyolab endfield"
PROVIDERS = ""
# HoYoLAB で受け取るゲーム（空白区切り）。例: "zzz gi hsr"
HOYOLAB_GAMES = "zzz"
# 成功時も通知するなら "1"。既定はエラー時のみ（毎日のスパム防止）。
NOTIFY_ON_SUCCESS = "0"

# --- 秘密（wrangler secret put で登録。ここには書かない）---
#   DISCORD_WEBHOOK : 通知先 Discord Webhook URL（任意）
#   TRIGGER_TOKEN   : 手動トリガ用トークン（任意）
#
# クレデンシャル本体（HoYoLAB Cookie / Endfield token）は secret ではなく
# /admin から KV に保存する。ローカル開発では .dev.vars の CRED_<ID> でも可。
#
# /admin は Cloudflare Access で必ず保護すること（README 参照）。
